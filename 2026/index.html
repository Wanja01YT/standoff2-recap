<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Not yet</title>
  <style>
    :root {
      color-scheme: dark;
    }
    html, body {
      height: 100%;
      margin: 0;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }
    .wrap {
      height: 100%;
      display: grid;
      place-items: center;
    }
    .text {
      font-size: clamp(28px, 6vw, 72px);
      font-weight: 600;
      letter-spacing: 0.2px;
      user-select: none;
    }
    /* Make the link look like normal text */
    .text a {
      color: inherit;
      text-decoration: none;
      cursor: default;
    }
    .text a:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 6px;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="text">
      Not yet
      <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" target="_blank" rel="noopener noreferrer" aria-label="👀">
        👀
      </a>
    </div>
  </div>
</body>
</html>
